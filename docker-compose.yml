version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  pg_data:
  pgadmin_data:

services:
  db:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: SecurePassword123!
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: crm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crm.local
      PGADMIN_DEFAULT_PASSWORD: StrongAdminPass2026!
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend-net
      - backend-net

  app:
    build:
      context: ./app
    container_name: crm_app
    restart: always
    environment:
      DATABASE_URL: postgresql://crm_user:SecurePassword123!@db:5432/crm_db
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - pgadmin
    networks:
      - frontend-net

  prometheus:
    image: prom/prometheus:latest
    container_name: crm_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: crm_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend-net
      - backend-net

  loki:
    image: grafana/loki:2.9.2
    container_name: crm_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - backend-net

  promtail:
    image: grafana/promtail:2.9.2
    container_name: crm_promtail
    restart: always
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-net
